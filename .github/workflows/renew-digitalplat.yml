name: DigitalPlat Domains Renew

on:
  workflow_dispatch:
  schedule:
    # 每月10号北京时间 15:00（UTC 07:00）
    - cron: "0 7 10 * *"

jobs:
  renew:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install cloudscraper
        run: pip3 install cloudscraper

      - name: Make script executable
        run: chmod +x renew-digitalplat-subdomains.sh

      - name: Run script
        env:
          # 多账号：DIGITALPLAT_ACCOUNTS="账号A,KEY_A" 换行/分号分隔多个
          # 兼容旧版：仅 DIGITALPLAT_API_KEY 单账号
          DIGITALPLAT_ACCOUNTS: ${{ secrets.DIGITALPLAT_ACCOUNTS }}
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ./renew-digitalplat-subdomains.sh
